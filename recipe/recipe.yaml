schema_version: 1

context:
  version: "26.8.0"

package:
  name: tox-ansible
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tox-ansible/tox_ansible-${{ version }}.tar.gz
  sha256: 44d5d08aab3bc471eef78fdb8e19eb81b347b70e0c75b728bfa9c0a1841c05e4

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools_scm >=7.0.5
    - setuptools >=65.3.0
  run:
    - python >=${{ python_min }}
    - pytest >=8.4.1
    - pytest-ansible >=3.1.0
    - pytest-xdist >=3.8.0
    - pyyaml >=6.0.1
    - tox >=4.47.3

tests:
  - python:
      imports:
        - tox_ansible
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: |
    A radical approach to testing ansible content
  homepage: https://pypi.org/project/tox-ansible/
  repository: https://pypi.org/project/tox-ansible/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - killua156
